<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<title>Solar Shadow Simulator</title>

<style>

body{
font-family: "Segoe UI", Arial;
background:#f6f6f6;
max-width:900px;
margin:auto;
padding:25px;
}

h2{
font-weight:500;
}

.panel{
background:white;
padding:18px;
border-radius:6px;
box-shadow:0 2px 6px rgba(0,0,0,0.08);
margin-bottom:20px;
}

input{
padding:6px;
margin:4px;
}

button{
padding:8px 14px;
margin:4px;
background:#2c3e50;
color:white;
border:none;
border-radius:4px;
cursor:pointer;
}

button:hover{
background:#1f2d3a;
}

canvas{
background:white;
border:1px solid #ddd;
border-radius:6px;
}

.result{
margin-top:15px;
font-size:17px;
}

</style>

</head>

<body>

<h2>Solar Shadow Simulator</h2>

<div class="panel">

Latitude (°)<br>
<input id="lat" type="number" step="0.01" value="23">

<br>

Longitude (°)<br>
<input id="lon" type="number" step="0.01" value="72">

<br>

Date<br>
<input id="date" type="date">

<br>

Time (IST)<br>
<input id="time" type="time">

<br>

Gnomon Height (cm)<br>
<input id="height" type="number" value="20">

<br><br>

<button onclick="calculate()">Shadow Length</button>
<button onclick="plotDailyShadow()">Daily Path</button>
<button onclick="plotAnalemma()">Analemma</button>

<div class="result" id="output"></div>

</div>

<canvas id="canvas" width="600" height="600"></canvas>

<script>

function dayOfYear(date){
let start=new Date(date.getFullYear(),0,0);
let diff=date-start;
let oneDay=1000*60*60*24;
return Math.floor(diff/oneDay);
}

function solarPosition(lat,lon,date,IST){

let N = dayOfYear(date);

let gamma = 2*Math.PI/365 * (N - 1 + (IST - 12)/24);

let EoT =
229.18 * (
0.000075
+ 0.001868 * Math.cos(gamma)
- 0.032077 * Math.sin(gamma)
- 0.014615 * Math.cos(2*gamma)
- 0.040849 * Math.sin(2*gamma)
);

let dec =
0.006918
- 0.399912 * Math.cos(gamma)
+ 0.070257 * Math.sin(gamma)
- 0.006758 * Math.cos(2*gamma)
+ 0.000907 * Math.sin(2*gamma)
- 0.002697 * Math.cos(3*gamma)
+ 0.00148 * Math.sin(3*gamma);

let timeOffset = EoT + 4*(lon - 82.5);

let tst = IST*60 + timeOffset;

let H = tst/4 - 180;

let h = H*Math.PI/180;
let phi = lat*Math.PI/180;

let sinAlt =
Math.sin(phi)*Math.sin(dec) +
Math.cos(phi)*Math.cos(dec)*Math.cos(h);

let alt=Math.asin(sinAlt);

let cosAz =
(Math.sin(dec)-Math.sin(alt)*Math.sin(phi))/
(Math.cos(alt)*Math.cos(phi));

let az=Math.acos(cosAz);

if(H>0) az=2*Math.PI-az;

return {alt:alt, az:az};

}

function drawDial(maxShadow){

let canvas=document.getElementById("canvas");
let ctx=canvas.getContext("2d");

ctx.clearRect(0,0,600,600);

let cx=300;
let cy=300;

let radius=260;

ctx.strokeStyle="#333";
ctx.lineWidth=1.5;

ctx.beginPath();
ctx.arc(cx,cy,radius,0,2*Math.PI);
ctx.stroke();

ctx.fillStyle="black";
ctx.beginPath();
ctx.arc(cx,cy,4,0,2*Math.PI);
ctx.fill();

ctx.fillText("N",cx,cy-radius-10);
ctx.fillText("S",cx,cy+radius+15);
ctx.fillText("E",cx+radius+10,cy);
ctx.fillText("W",cx-radius-15,cy);

return {cx,cy,radius};

}

function calculate(){

let lat=parseFloat(latInput.value);
let lon=parseFloat(lonInput.value);
let height=parseFloat(heightInput.value);

let dateStr=dateInput.value;
let timeStr=timeInput.value;

if(!dateStr||!timeStr){
output.innerHTML="Enter date and time";
return;
}

let d=new Date(dateStr);

let t=timeStr.split(":");

let IST=parseFloat(t[0])+parseFloat(t[1])/60;

let pos=solarPosition(lat,lon,d,IST);

if(pos.alt<=0){
output.innerHTML="Sun below horizon";
return;
}

let shadow=height/Math.tan(pos.alt);

output.innerHTML=
"Solar Altitude: "+(pos.alt*180/Math.PI).toFixed(2)+"°<br>"+
"Shadow Length: "+shadow.toFixed(2)+" cm";

}

function plotDailyShadow(){

let lat=parseFloat(latInput.value);
let lon=parseFloat(lonInput.value);
let height=parseFloat(heightInput.value);

let d=new Date(dateInput.value);

let maxShadow=height/Math.tan(10*Math.PI/180);

let dial=drawDial(maxShadow);

let scale=dial.radius/maxShadow;

let ctx=canvas.getContext("2d");

ctx.strokeStyle="blue";
ctx.beginPath();

for(let t=6*60;t<=18*60;t+=5){

let IST=t/60;

let pos=solarPosition(lat,lon,d,IST);

if(pos.alt<=0)continue;

let L=height/Math.tan(pos.alt);

let saz=pos.az+Math.PI;

let x=L*Math.sin(saz)*scale;
let y=L*Math.cos(saz)*scale;

let px=dial.cx+x;
let py=dial.cy-y;

ctx.lineTo(px,py);

}

ctx.stroke();

}

function plotAnalemma(){

let lat=parseFloat(latInput.value);
let lon=parseFloat(lonInput.value);
let height=parseFloat(heightInput.value);

let t=timeInput.value.split(":");

let IST=parseFloat(t[0])+parseFloat(t[1])/60;

let maxShadow=height/Math.tan(10*Math.PI/180);

let dial=drawDial(maxShadow);

let scale=dial.radius/maxShadow;

let ctx=canvas.getContext("2d");

ctx.fillStyle="green";

for(let N=1;N<=365;N++){

let d=new Date(2026,0);
d.setDate(N);

let pos=solarPosition(lat,lon,d,IST);

if(pos.alt<=0)continue;

let L=height/Math.tan(pos.alt);

let saz=pos.az+Math.PI;

let x=L*Math.sin(saz)*scale;
let y=L*Math.cos(saz)*scale;

ctx.beginPath();
ctx.arc(dial.cx+x,dial.cy-y,2,0,2*Math.PI);
ctx.fill();

}

}

let latInput=document.getElementById("lat");
let lonInput=document.getElementById("lon");
let dateInput=document.getElementById("date");
let timeInput=document.getElementById("time");
let heightInput=document.getElementById("height");
let output=document.getElementById("output");
let canvas=document.getElementById("canvas");

</script>

</body>
</html>
