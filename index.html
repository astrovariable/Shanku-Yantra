<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Solar Shadow Plotter</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<h2>Solar Shadow Plotter</h2>

<div class="controls">

<div class="row">

<div class="field">
<label>Latitude</label>
<input id="lat" type="number" value="23" step="0.01">
</div>

<div class="field">
<label>Longitude</label>
<input id="lon" type="number" value="72" step="0.01">
</div>

<div class="field">
<label>Date</label>
<input id="date" type="date">
</div>

<div class="field">
<label>Time (for Analemma)</label>
<input id="time" type="time">
</div>

</div>


<div class="row">

<div class="field">
<label>Gnomon Height (cm)</label>
<input id="height" type="number" value="20">
</div>

<div class="field">
<label>Scale (px/cm)</label>
<input id="scale" type="number" value="5">
</div>

<div class="field">
<label>Plot Color</label>
<input id="color" type="color" value="#0066ff">
</div>

<div class="field">
<label>Line Width</label>
<input id="width" type="number" value="2">
</div>

</div>

</div>

<div class="buttons">

<button onclick="drawGrid()">Reset Grid</button>
<button onclick="plotDaily()">Daily Shadow</button>
<button onclick="plotAnalemma()">Analemma</button>

</div>

<canvas id="plotCanvas"></canvas>

<script src="script.js"></script>

</body>
</html>
